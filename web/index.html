<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <style>html,body{background:#090909;color:#ededed;color-scheme:dark}</style>
    <script>
      (() => {
        let theme = 'blue';
        try { if (localStorage.getItem('civitai-studio-theme') === 'red') theme = 'red'; } catch {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Civitai Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
