name: Desktop beta packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*-beta*'

# Build artifacts for review. Publishing a GitHub release is a separate action.
permissions:
  contents: read

concurrency:
  group: desktop-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget unzip zip file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libdbus-1-dev libsecret-1-dev xdg-utils libfuse2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Package Windows and Linux
        if: runner.os != 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun desktop:release --target ${{ matrix.target }}

      - name: Package macOS with ad-hoc signature
        if: runner.os == 'macOS'
        env:
          # Local integrity only: this is not Developer ID signing/notarization.
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun desktop:release --target ${{ matrix.target }}

      - name: Verify Windows updater installation and registration
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'The isolated Windows runner requires an elevated token for this per-machine installer check.' }
          $output = Join-Path 'releases' $env:RELEASE_TARGET
          $manifest = Get-Content -LiteralPath (Join-Path $output 'release-manifest.json') -Raw | ConvertFrom-Json
          $installer = (Resolve-Path -LiteralPath (Join-Path $output $manifest.updater.filename)).Path
          $installDirectory = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'civitai-studio-updater-install'))
          $registryPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Civitai Studio Alpha'
          if (Test-Path -LiteralPath $registryPath) { throw 'Expected a clean ephemeral runner with no existing Studio installation.' }
          # Exercise the updater's /UPDATE path without launching an app or
          # downloading WebView2. This VM is discarded after the job.
          $first = Start-Process -FilePath $installer -ArgumentList @('/S', '/UPDATE', '/NS', "/D=$installDirectory") -PassThru -WindowStyle Hidden
          if (-not $first.WaitForExit(120000) -or $first.ExitCode -ne 0) { throw 'The isolated updater installer did not complete successfully.' }
          $registration = Get-ItemProperty -LiteralPath $registryPath
          if ($registration.InstallLocation.Trim('"') -ne $installDirectory -or $registration.MainBinaryName -ne 'civitai-studio-desktop.exe') { throw 'Installed registration does not match the updater-supported executable path.' }
          foreach ($file in @($registration.MainBinaryName, 'studio-service.exe', 'uninstall.exe')) { if (-not (Test-Path -LiteralPath (Join-Path $installDirectory $file) -PathType Leaf)) { throw "The installed package is missing $file." } }
          $bundledService = Join-Path 'desktop/src-tauri/binaries' "studio-service-$($env:RELEASE_TARGET).exe"
          if ((Get-FileHash -LiteralPath (Join-Path $installDirectory 'studio-service.exe')).Hash -ne (Get-FileHash -LiteralPath $bundledService).Hash) { throw 'Installed service differs from the signed release build.' }
          # With /D omitted, another update must preserve the chosen directory.
          $second = Start-Process -FilePath $installer -ArgumentList @('/S', '/UPDATE', '/NS') -PassThru -WindowStyle Hidden
          if (-not $second.WaitForExit(120000) -or $second.ExitCode -ne 0) { throw 'The second isolated update did not complete successfully.' }
          if ((Get-ItemProperty -LiteralPath $registryPath).InstallLocation.Trim('"') -ne $installDirectory) { throw 'The updater did not preserve the custom installation directory.' }
          Write-Output 'Windows updater installation, paired binaries, registry identity, and retained install directory passed. No app, account, or provider operation was launched.'

      - name: Verify packaged service startup
        if: runner.os != 'Windows'
        shell: python {0}
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          import base64, hashlib, json, os, pathlib, plistlib, secrets, select
          import subprocess, tarfile, tempfile, urllib.error, urllib.request, zipfile

          target = os.environ['RELEASE_TARGET']
          output = pathlib.Path('releases') / target
          manifest = json.loads((output / 'release-manifest.json').read_text())
          mac = target.endswith('-apple-darwin')
          extension = '.zip' if mac else '.tar.gz'
          archive = output / f"Civitai-Studio-{manifest['version']}-{target}{extension}"
          with tempfile.TemporaryDirectory(prefix='civitai-release-check-') as temporary:
              temporary = pathlib.Path(temporary)
              service = temporary / 'studio-service'
              if mac:
                  with zipfile.ZipFile(archive) as package:
                      names = [name for name in package.namelist() if name.endswith('/Civitai Studio.app/Contents/MacOS/studio-service') and not name.startswith('__MACOSX/')]
                      assert len(names) == 1, 'Packaged service is missing or duplicated'
                      service.write_bytes(package.read(names[0]))
              else:
                  with tarfile.open(archive, 'r:gz') as package:
                      members = [member for member in package.getmembers() if member.name == 'Civitai Studio/studio-service']
                      assert len(members) == 1 and members[0].isfile(), 'Packaged service is missing or duplicated'
                      service.write_bytes(package.extractfile(members[0]).read())
              service.chmod(0o755)
              if mac:
                  subprocess.run(['/usr/bin/codesign', '--verify', '--strict', str(service)], check=True, capture_output=True)
                  signing = subprocess.run(['/usr/bin/codesign', '-d', '--entitlements', ':-', str(service)], check=True, capture_output=True)
                  entitlements = plistlib.loads(signing.stdout)
                  assert entitlements == {'com.apple.security.cs.allow-jit': True}, 'Unexpected packaged service entitlements'
              profile = temporary / 'profile'
              profile.mkdir()
              gate_name, gate = 'studio_desktop_' + secrets.token_hex(16), secrets.token_hex(32)
              environment = {name: os.environ[name] for name in ['TMPDIR', 'LANG', 'LC_ALL'] if name in os.environ}
              process = subprocess.Popen([str(service)], cwd=temporary, env=environment, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              try:
                  bootstrap = {'dataDir': str(profile), 'encryptionKey': base64.b64encode(os.urandom(32)).decode(), 'gateName': gate_name, 'gate': gate}
                  process.stdin.write((json.dumps(bootstrap) + '\n').encode())
                  process.stdin.flush()
                  assert select.select([process.stdout], [], [], 30)[0], 'Packaged service startup timed out'
                  line = process.stdout.readline(257)
                  assert len(line) <= 256, 'Unexpected service readiness record'
                  ready = json.loads(line)
                  assert ready.get('desktopReady') == 1 and 0 < ready.get('port', 0) < 65536, 'Packaged service did not start'
                  origin = 'http://127.0.0.1:' + str(ready['port'])
                  cookie = gate_name + '=' + gate

                  def request(path, headers=None):
                      try:
                          with urllib.request.urlopen(urllib.request.Request(origin + path, headers=headers or {}), timeout=10) as response:
                              return response.status, response.read()
                      except urllib.error.HTTPError as error:
                          return error.code, error.read()

                  for route in ['/', '/healthz', '/api/studio/v1/session']:
                      assert request(route)[0] == 403, 'Missing-cookie request was accepted'
                  for asset in manifest['frontend']:
                      path = '/' if asset['path'] == '/index.html' else asset['path']
                      assert path == '/' or path.startswith('/assets/'), 'Unexpected frontend path'
                      status, content = request(path, {'Cookie': cookie})
                      assert status == 200 and len(content) == asset['bytes'] and hashlib.sha256(content).hexdigest() == asset['sha256'], 'Packaged frontend differs from release manifest'
                  status, content = request('/api/studio/v1/session', {'Cookie': cookie})
                  session = json.loads(content)
                  assert status == 200 and session['connected'] is False and session['user'] is None, 'Release contains an account'
                  assert session['credentialStorage']['mode'] == 'encrypted' and session['credentialStorage']['persistent'] is True, 'Encrypted persistence unavailable'
                  for extra in [{'Origin': 'https://example.invalid'}, {'Host': 'example.invalid'}, {'Sec-Fetch-Site': 'cross-site'}]:
                      assert request('/api/studio/v1/session', {'Cookie': cookie, **extra})[0] == 403, 'Cross-origin request was accepted'
                  process.stdin.close()
                  assert process.wait(timeout=10) == 0, 'Packaged service did not stop cleanly'
                  print(('macOS signed' if mac else 'Linux') + ' packaged service startup, embedded assets, fresh encrypted profile, request isolation, and shutdown passed. No provider credentials or requests used.')
              finally:
                  if process.poll() is None:
                      process.kill()
                      process.wait(timeout=10)

      - name: Upload release files only
        uses: actions/upload-artifact@v7
        with:
          name: civitai-studio-beta-${{ matrix.target }}
          path: |
            releases/${{ matrix.target }}/*.zip
            releases/${{ matrix.target }}/*.tar.gz
            releases/${{ matrix.target }}/*.exe
            releases/${{ matrix.target }}/*.msi
            releases/${{ matrix.target }}/*.dmg
            releases/${{ matrix.target }}/*.deb
            releases/${{ matrix.target }}/*.rpm
            releases/${{ matrix.target }}/*.AppImage
            releases/${{ matrix.target }}/*.sig
            releases/${{ matrix.target }}/SHA256SUMS
            releases/${{ matrix.target }}/release-manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: false
