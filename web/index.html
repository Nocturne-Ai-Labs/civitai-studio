<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1b1e" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/studio-mark.svg?no-inline" />
    <style>html,body{background:#141517;color:#f8f9fa;color-scheme:dark}</style>
    <script>
      (() => {
        let theme = 'blue';
        try { if (localStorage.getItem('civitai-studio-theme') === 'red') theme = 'red'; } catch {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Civitai Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
